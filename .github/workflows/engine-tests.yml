# 엔진 테스트 — push·PR마다 24건 기대값 포함 전체 테스트를 돌린다.
# C# 플러그인은 AutoCAD DLL이 필요해 여기서 빌드하지 않는다 (autocad/README.md 첫 실행 확인표로 확인).
name: engine-tests

on:
  push:
    branches: [main, master]   # 기본 브랜치 이름이 master로 만들어져도 첫 push에 돌게
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: ezdxf 설치 (DXF 경로 테스트용)
        run: python -m pip install "ezdxf==1.4.4"   # 버전 고정 — 올릴 때는 여기만 바꾸고 CI로 확인
      - name: 단위 테스트 (24건 기대값 포함)
        working-directory: engine
        run: python -m unittest discover -s tests -v
      - name: 24건 표가 expected_24.json과 일치하는지
        working-directory: engine
        run: |
          python scripts/render_cases.py
          git diff --exit-code -- ../docs/test-cases.md
